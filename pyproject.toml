[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MCEvidence"
dynamic = ["version"]
description = "Bayesian evidence estimation from MCMC chains"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "Yabebal Fantaye", email = "yabi@aims.ac.za"}
]
keywords = ["MCMC", "Evidence", "Bayesian evidence", "Cosmology"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.20.0",
  "scipy>=1.7.0",
  "pandas>=1.3.0",
  "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
getdist = ["getdist>=1.3.0"]
cobaya = ["cobaya>=3.0.0", "PyYAML>=6.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
mcevidence = "mcevidence.core:main"

[tool.setuptools]
py-modules = ["MCEvidence"]
packages = ["mcevidence"]

[tool.setuptools.dynamic]
version = {attr = "mcevidence.core.__version__"}
